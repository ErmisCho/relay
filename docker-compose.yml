# One shared database for every checkout/worktree: without a fixed name, Compose
# derives the project from the folder and a second copy fights over port 55432.
name: relay

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "55432:5432"
    volumes:
      - relay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  relay-pgdata:
