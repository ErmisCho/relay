[project]
name = "relay"
version = "0.1.0"
description = "Voice-first ideation agent: wake word, ElevenLabs voice loop, Delegator, durable executors and a Postgres idea graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.54.0",
  "httpx>=0.28.1",
  "openai>=3.19.2",
  "anthropic>=1.8.0",
  "dbos>=3.1.0",
  "pydantic-ai-slim[anthropic,dbos,duckduckgo,openai]>=2.51.0",
  "trafilatura>=2.2.0",
  "elevenlabs>=2.69.0",
  "openwakeword>=0.4.0",
  "sounddevice>=0.5.6",
  "numpy>=2.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["relay"]
strict = true
plugins = ["pydantic.mypy"]
